<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Minhas Finanças</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#edf0f5; --bg2:#ffffff;
  --card:#ffffff; --card-border:#e4e8f0;
  --text:#161a24; --muted:#6b7280;
  --green:#16a34a; --red:#dc2626; --gold:#d97706;
  --grad:linear-gradient(135deg,#5b21b6 0%,#7c3aed 60%,#8b5cf6 100%);
  --radius:20px;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
body{
  margin:0; font-family:'Inter',system-ui,sans-serif; background:var(--bg); color:var(--text);
  min-height:100vh; padding-bottom:96px;
  background-image:radial-gradient(600px 300px at 20% -5%,rgba(124,58,237,.10),transparent),
                   radial-gradient(500px 260px at 90% 10%,rgba(6,182,212,.08),transparent);
  background-attachment:fixed;
}
.wrap{max-width:480px; margin:0 auto; padding:12px 12px 0;}
header.top{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;}
.logo{font-weight:800; font-size:18px; letter-spacing:.3px;}
.logo span{background:var(--grad); -webkit-background-clip:text; background-clip:text; color:transparent;}
.monthnav{display:flex; align-items:center; gap:6px; background:var(--card); border:1px solid var(--card-border);
  border-radius:999px; padding:4px 6px; box-shadow:0 2px 8px rgba(25,30,60,.05);}
.monthnav button{background:none; border:none; color:var(--text); font-size:16px; cursor:pointer; padding:2px 8px; border-radius:999px;}
.monthnav button:active{background:rgba(0,0,0,.06);}
.monthnav .mlabel{font-size:12px; font-weight:600; text-transform:capitalize; min-width:96px; text-align:center; white-space:nowrap;}
.segwrap{margin-bottom:10px;}
.seg{display:flex; background:#dfe4ee; border-radius:999px; padding:3px; gap:2px;}
.seg button{flex:1; border:none; background:none; padding:7px 0; border-radius:999px; font-size:12px; font-weight:700; color:var(--muted); cursor:pointer; font-family:inherit;}
.seg button.on{background:#fff; color:#5b21b6; box-shadow:0 2px 8px rgba(25,30,60,.14);}
.hero{
  background:var(--grad); border-radius:var(--radius); padding:15px 18px; margin-bottom:10px;
  box-shadow:0 12px 40px rgba(124,58,237,.35); position:relative; overflow:hidden;
  animation:rise .5s ease both; color:#fff;
}
.hero::after{content:''; position:absolute; right:-40px; top:-40px; width:160px; height:160px;
  background:rgba(255,255,255,.12); border-radius:50%;}
.hero .hlabel{font-size:11px; opacity:.85; font-weight:600; letter-spacing:1.5px;}
.hero .hvalue{font-size:30px; font-weight:800; margin:4px 0 2px; letter-spacing:-1px;}
.hero .hsub{font-size:12px; opacity:.85;}
.duo{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:10px;}
.card{background:var(--card); border:1px solid var(--card-border); border-radius:var(--radius);
  padding:12px 14px; animation:rise .5s ease both; backdrop-filter:blur(8px);
  box-shadow:0 4px 18px rgba(25,30,60,.07);}
.card .clabel{font-size:11px; color:var(--muted); font-weight:600; margin-bottom:4px;}
.card .cvalue{font-size:18px; font-weight:800; letter-spacing:-.5px;}
.up{color:var(--green);} .down{color:var(--red);}
.sec-title{font-size:13.5px; font-weight:700; margin:14px 2px 8px; display:flex; align-items:center; gap:8px;}
.chartcard{display:flex; gap:14px; align-items:center;}
.donut{width:118px; height:118px; border-radius:50%; flex:none; position:relative;
  display:flex; align-items:center; justify-content:center;}
.donut::after{content:''; position:absolute; inset:20px; background:var(--bg2); border-radius:50%;}
.donut-center{position:relative; z-index:1; text-align:center;}
.donut-center .v{font-size:15px; font-weight:800;}
.donut-center .l{font-size:9px; color:var(--muted); font-weight:600;}
.legend{flex:1; display:flex; flex-direction:column; gap:6px; font-size:12px;}
.legend .li{display:flex; align-items:center; gap:8px;}
.legend .dot{width:10px; height:10px; border-radius:50%; flex:none;}
.legend .pct{margin-left:auto; color:var(--muted); font-weight:600;}
.tx{display:flex; align-items:center; gap:10px; padding:10px 12px; background:var(--card);
  border:1px solid var(--card-border); border-radius:14px; margin-bottom:8px; animation:rise .4s ease both;
  box-shadow:0 2px 10px rgba(25,30,60,.05);}
.tx .ico{width:36px; height:36px; border-radius:12px; display:flex; align-items:center; justify-content:center;
  font-size:18px; flex:none; background:rgba(124,58,237,.09);}
.tx .info{flex:1; min-width:0;}
.tx .desc{font-weight:600; font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.tx .meta{font-size:11px; color:var(--muted); margin-top:2px;}
.tx .val{font-weight:800; font-size:14px; white-space:nowrap;}
.tx .acts{display:flex; gap:2px;}
.tx .acts button{background:none; border:none; font-size:15px; cursor:pointer; padding:4px; opacity:.7;}
.tx .acts button:active{opacity:1; transform:scale(1.15);}
.empty{text-align:center; color:var(--muted); padding:24px 16px; font-size:13px; line-height:1.7;}
.empty .big{font-size:36px; display:block; margin-bottom:8px;}
/* input bar */
.inputbar{position:fixed; left:0; right:0; bottom:0; z-index:20;
  background:rgba(255,255,255,.93); backdrop-filter:blur(14px);
  border-top:1px solid var(--card-border); padding:10px 12px calc(10px + env(safe-area-inset-bottom));}
.inputbar .inner{max-width:480px; margin:0 auto;}
.hint{font-size:11.5px; color:var(--muted); margin:0 4px 8px;}
.hint b{color:#7c3aed;}
.chatrow{display:flex; gap:8px;}
#txt{flex:1; background:#eef1f6; border:1px solid var(--card-border); color:var(--text);
  border-radius:999px; padding:12px 16px; font-size:16px; font-family:inherit; outline:none;}
#txt:focus{border-color:#7c3aed;}
#sendBtn{width:52px; height:52px; flex:none; border:none; border-radius:50%; cursor:pointer;
  background:var(--grad); color:#fff; font-size:20px; box-shadow:0 6px 20px rgba(124,58,237,.45);}
#sendBtn:active{transform:scale(.92);}
.inputbar{transition:transform .35s cubic-bezier(.32,.72,.35,1);}
.inputbar.hidden{transform:translateY(110%);}
.fab{position:fixed; right:16px; bottom:calc(20px + env(safe-area-inset-bottom)); width:58px; height:58px;
  border-radius:50%; background:var(--grad); color:#fff; font-size:30px; line-height:1; border:none;
  box-shadow:0 8px 24px rgba(124,58,237,.45); z-index:25; cursor:pointer;
  display:flex; align-items:center; justify-content:center; transition:transform .3s ease, opacity .25s ease;}
.fab.hidden{transform:scale(0); opacity:0; pointer-events:none;}
#hideBar{background:none; border:none; font-size:22px; color:var(--muted); cursor:pointer; padding:4px 6px; flex:none;}
.btn-pdf{width:100%; margin:10px 0 0; border:none; border-radius:14px; padding:12px; font-weight:800; font-size:14px;
  cursor:pointer; font-family:inherit; background:var(--grad); color:#fff; box-shadow:0 6px 18px rgba(124,58,237,.35);}
.btn-pdf:active{transform:scale(.98);}
/* preview */
#preview{display:none; margin-top:10px; background:rgba(124,58,237,.12); border:1px solid rgba(124,58,237,.4);
  border-radius:16px; padding:14px;}
#preview.show{display:block; animation:rise .3s ease both;}
#preview .prow{display:flex; align-items:center; gap:10px; margin-bottom:6px;}
#preview .pval{font-size:24px; font-weight:800;}
#preview .pchip{background:rgba(124,58,237,.12); border-radius:999px; padding:4px 12px; font-size:12px; font-weight:600;}
#preview .pdesc{color:var(--muted); font-size:13px;}
#preview .pbtns{display:flex; gap:8px; margin-top:10px;}
.btn{flex:1; border:none; border-radius:12px; padding:12px; font-weight:700; font-size:14px; cursor:pointer; font-family:inherit;}
.btn-ok{background:var(--green); color:#04120a;}
.btn-edit{background:#eef1f6; color:var(--text);}
.btn-cancel{background:none; color:var(--muted); flex:.6;}
#editForm{display:none; margin-top:10px; gap:8px; flex-direction:column;}
#editForm.show{display:flex;}
#editForm input,#editForm select{background:#eef1f6; border:1px solid var(--card-border);
  color:var(--text); border-radius:10px; padding:10px 12px; font-size:14px; font-family:inherit; width:100%;}
#editForm select option{background:#ffffff;}
#editForm .erow{display:flex; gap:8px;}
@keyframes rise{from{opacity:0; transform:translateY(14px);} to{opacity:1; transform:none;}}
.modal{position:fixed; inset:0; z-index:30; background:rgba(0,0,0,.6); display:none;
  align-items:flex-end; justify-content:center; backdrop-filter:blur(4px);}
.modal.show{display:flex;}
.sheet{background:#ffffff; border-radius:24px 24px 0 0; padding:20px; width:100%; max-width:480px;
  animation:rise .3s ease both; padding-bottom:calc(24px + env(safe-area-inset-bottom));}
.sheet h3{margin:0 0 14px; font-size:16px;}
.sheet label{font-size:12px; color:var(--muted); font-weight:600; display:block; margin:10px 0 6px;}
.sheet input,.sheet select{background:#eef1f6; border:1px solid var(--card-border);
  color:var(--text); border-radius:10px; padding:11px 12px; font-size:15px; font-family:inherit; width:100%;}
.sheet select option{background:#ffffff;}
.sheet .srow{display:flex; gap:8px; margin-top:16px;}
.kindtoggle{display:flex; background:#eef1f6; border-radius:12px; padding:4px; gap:4px;}
.kindtoggle button{flex:1; border:none; background:none; color:var(--muted); padding:10px; border-radius:9px;
  font-weight:700; cursor:pointer; font-family:inherit;}
.kindtoggle button.on-expense{background:rgba(244,63,94,.25); color:#fda4af;}
.kindtoggle button.on-income{background:rgba(34,197,94,.25); color:#86efac;}
#printReport{display:none;}
@media print{
  @page{margin:12mm;}
  body{background:#fff !important; background-image:none !important; padding:0 !important; color:#111;}
  body > *:not(#printReport){display:none !important;}
  #printReport{display:block !important; font-size:12px; color:#111;}
  #printReport h1{font-size:20px; margin:0 0 2px;}
  #printReport h2{font-size:15px; margin:0 0 2px; color:#333; text-transform:capitalize;}
  #printReport .pr-date{font-size:11px; color:#666; margin:0 0 14px;}
  #printReport .pr-kpis{display:flex; gap:10px; margin:0 0 16px;}
  #printReport .pr-kpi{flex:1; border:1px solid #ddd; border-radius:8px; padding:10px; text-align:center;}
  #printReport .pr-kpi .l{font-size:10px; color:#666; font-weight:700;}
  #printReport .pr-kpi .v{font-size:16px; font-weight:800;}
  #printReport h3{font-size:13px; margin:16px 0 8px; border-bottom:2px solid #7c3aed; padding-bottom:4px;}
  #printReport table{width:100%; border-collapse:collapse;}
  #printReport th,#printReport td{border:1px solid #ddd; padding:6px 8px; text-align:left; font-size:11.5px;}
  #printReport th{background:#f3f4f6;}
  #printReport td.num,#printReport th.num{text-align:right; white-space:nowrap;}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="logo">💰 Minhas <span>Finanças</span></div>
    <div class="monthnav">
      <button id="prevM">‹</button>
      <div class="mlabel" id="monthLabel"></div>
      <button id="nextM">›</button>
    </div>
  </header>
  <div class="segwrap"><div class="seg" id="segPeriod">
    <button data-p="week">Semanal</button>
    <button data-p="half">Quinzenal</button>
    <button data-p="month" class="on">Mensal</button>
  </div></div>

  <div class="hero">
    <div class="hlabel" id="hPeriod">SALDO DO MÊS</div>
    <div class="hvalue" id="hSaldo">R$ 0,00</div>
    <div class="hsub" id="hSub">toque abaixo e lance seu primeiro gasto 👇</div>
  </div>

  <div class="duo">
    <div class="card"><div class="clabel">📈 Ganhos</div><div class="cvalue up" id="cGanhos">R$ 0,00</div></div>
    <div class="card"><div class="clabel">📉 Gastos</div><div class="cvalue down" id="cGastos">R$ 0,00</div></div>
  </div>

  <div class="sec-title">🍩 Gastos por categoria</div>
  <div class="card chartcard">
    <div class="donut" id="donut"><div class="donut-center"><div class="v" id="donutV">R$ 0</div><div class="l">NO PERÍODO</div></div></div>
    <div class="legend" id="legend"></div>
  </div>

  <button class="btn-pdf" id="btnPdf">📄 Relatório em PDF</button>

  <div class="sec-title">🧾 Lançamentos</div>
  <div id="txList"></div>
</div>

<div class="inputbar hidden" id="inputbar"><div class="inner">
  <p class="hint">Ex.: <b>"gastei 50 no mercado"</b> · <b>"café da manhã 39,55"</b> · <b>"recebi 2000 salário"</b></p>
  <div class="chatrow">
    <button id="hideBar" title="Ocultar">⌄</button>
    <input id="txt" placeholder="Descreva seu gasto ou ganho…" autocomplete="off" enterkeyhint="send">
    <button id="sendBtn" title="Lançar">➤</button>
  </div>
  <div id="preview"></div>
</div></div>
<button class="fab" id="fab" title="Novo lançamento">+</button>

<div class="modal" id="editModal"><div class="sheet">
  <h3>✏️ Editar lançamento</h3>
  <label>Tipo</label>
  <div class="kindtoggle">
    <button id="kExp">📉 Gasto</button>
    <button id="kInc">📈 Ganho</button>
  </div>
  <label>Descrição</label><input id="eDesc">
  <label>Valor (R$)</label><input id="eVal" inputmode="decimal">
  <label>Categoria</label><select id="eCat"></select>
  <label>Data</label><input id="eDate" type="date">
  <div class="srow">
    <button class="btn btn-ok" id="eSave">Salvar</button>
    <button class="btn btn-cancel" id="eClose">Fechar</button>
  </div>
</div></div>

<script>
"use strict";
/* ---------- utils ---------- */
const $ = id => document.getElementById(id);
const norm = s => (s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
const BRL = v => (v/100).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const todayStr = () => { const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,7);

/* ---------- categorias ---------- */
const CATS = [
  {name:'Alimentação', icon:'🍔', color:'#fb923c', words:['cafe','manha','almoco','jantar','restaurante','mercado','supermercado','padaria','lanche','pizza','comida','ifood','acai','hamburguer','marmita','lanchonete','sorvete','churrasco','lanche']},
  {name:'Transporte', icon:'🚗', color:'#38bdf8', words:['uber','99','gasolina','combustivel','onibus','transporte','taxi','passagem','estacionamento','pedagio','metro','trem','mototaxi','99app']},
  {name:'Moradia', icon:'🏠', color:'#a78bfa', words:['aluguel','luz','energia','agua','internet','condominio','iptu','gas','moradia','reforma','telefone fixo']},
  {name:'Saúde', icon:'💊', color:'#f472b6', words:['farmacia','medico','remedio','dentista','exame','hospital','saude','consulta','oculos','plano']},
  {name:'Lazer', icon:'🎮', color:'#facc15', words:['cinema','show','festa','bar','cerveja','jogo','netflix','spotify','lazer','viagem','praia','parque','streaming','ifood']},
  {name:'Compras', icon:'🛍️', color:'#34d399', words:['roupa','camisa','sapato','tenis','shopping','loja','presente','eletronico','celular','computador','movel','blusa','calca']},
  {name:'Educação', icon:'📚', color:'#60a5fa', words:['escola','curso','faculdade','livro','mensalidade','aula','colegio']},
];
const CAT_OUTROS = {name:'Outros', icon:'📦', color:'#94a3b8', words:[]};
const CAT_RECEITAS = {name:'Receitas', icon:'💰', color:'#22c55e', words:[]};
const ALL_CATS = [...CATS, CAT_OUTROS, CAT_RECEITAS];
const catOf = n => ALL_CATS.find(c=>c.name===n) || CAT_OUTROS;
const INCOME_WORDS = ['recebi','ganhei','salario','entrada','recebimento','renda','freelance','comissao','ganho'];
const EXPENSE_WORDS = ['gastei','paguei','comprei','pago','gasto','pagar'];
const FILLER = ['de','do','da','dos','das','no','na','nos','nas','em','um','uma','o','a','os','as','com','foi','por','pra','para'];

/* ---------- parser ---------- */
function parseAmount(t){
  const m = t.match(/(\d{1,3}(?:\.\d{3})+,\d{1,2}|\d+,\d{1,2}|\d{1,3}(?:\.\d{3})+|\d+\.\d{1,2}|\d+)/);
  if(!m) return null;
  let s = m[0];
  if(s.includes(',')){ s = s.replace(/\./g,'').replace(',','.'); }
  else if(/(\.\d{3})+$/.test(s)){ s = s.replace(/\./g,''); }
  const v = parseFloat(s);
  return isNaN(v)? null : Math.round(v*100);
}
function parseKind(t){
  const n = norm(t);
  if(INCOME_WORDS.some(w=>n.includes(w))) return 'income';
  return 'expense';
}
function parseCategory(t, kind){
  if(kind==='income') return 'Receitas';
  const n = ' '+norm(t)+' ';
  for(const c of CATS){ if(c.words.some(w=>n.includes(w))) return c.name; }
  return 'Outros';
}
function parseDescription(t, kind){
  let s = t.replace(/(\d{1,3}(?:\.\d{3})*,\d{1,2}|\d+,\d{1,2}|\d{1,3}(?:\.\d{3})+|\d+\.\d{1,2}|\d+)/g,' ');
  const verbs = [...INCOME_WORDS, ...EXPENSE_WORDS, 'ontem','hoje'];
  verbs.forEach(v=>{ s = s.replace(new RegExp('\\b'+v+'\\b','gi'),' '); });
  const words = s.split(/\s+/).filter(w=>w && !FILLER.includes(norm(w)));
  s = words.join(' ').trim();
  if(!s) s = kind==='income' ? 'Receita' : 'Gasto';
  return s.charAt(0).toUpperCase()+s.slice(1);
}
function parseDate(t){
  if(norm(t).includes('ontem')){ const d=new Date(); d.setDate(d.getDate()-1);
    return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
  return todayStr();
}
function parseText(t){
  const cents = parseAmount(t);
  if(cents===null) return null;
  const kind = parseKind(t);
  return { kind, amount_cents:cents, category:parseCategory(t,kind),
           description:parseDescription(t,kind), occurred_on:parseDate(t) };
}

/* ---------- storage ---------- */
const KEY='mf_v1';
const load = () => { try{ return JSON.parse(localStorage.getItem(KEY))||[]; }catch(e){ return []; } };
const save = txs => localStorage.setItem(KEY, JSON.stringify(txs));

/* ---------- state ---------- */
let period = 'month';
let anchor = new Date();
let pending = null, editingId = null;

const MESES=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const MABBR=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const isoD = d => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const dstr = d => d.getDate()+' '+MABBR[d.getMonth()];

function getRange(){
  const a = new Date(anchor.getFullYear(), anchor.getMonth(), anchor.getDate());
  const y=a.getFullYear(), m=a.getMonth();
  if(period==='week'){
    const dow=(a.getDay()+6)%7;
    const s=new Date(a); s.setDate(a.getDate()-dow);
    const e=new Date(s); e.setDate(s.getDate()+6);
    return {s, e, label:dstr(s)+' – '+dstr(e), hero:'SALDO DA SEMANA'};
  }
  if(period==='half'){
    if(a.getDate()<=15) return {s:new Date(y,m,1), e:new Date(y,m,15), label:'1ª quinzena · '+MABBR[m], hero:'SALDO DA QUINZENA'};
    const last=new Date(y,m+1,0).getDate();
    return {s:new Date(y,m,16), e:new Date(y,m,last), label:'2ª quinzena · '+MABBR[m], hero:'SALDO DA QUINZENA'};
  }
  const last=new Date(y,m+1,0).getDate();
  return {s:new Date(y,m,1), e:new Date(y,m,last), label:MESES[m]+' '+y, hero:'SALDO DO MÊS'};
}
const periodTxs = () => {
  const r=getRange(), s0=isoD(r.s), s1=isoD(r.e);
  return load().filter(t=>t.occurred_on>=s0 && t.occurred_on<=s1);
};

/* ---------- render ---------- */
function render(){
  const R = getRange();
  $('monthLabel').textContent = R.label;
  $('hPeriod').textContent = R.hero;
  const txs = periodTxs().sort((a,b)=> b.occurred_on.localeCompare(a.occurred_on) || b.created_at.localeCompare(a.created_at));
  const ganhos = txs.filter(t=>t.kind==='income').reduce((s,t)=>s+t.amount_cents,0);
  const gastos = txs.filter(t=>t.kind==='expense').reduce((s,t)=>s+t.amount_cents,0);
  const saldo = ganhos-gastos;
  $('hSaldo').textContent = BRL(saldo);
  $('hSaldo').style.color = saldo<0 ? '#fecdd3' : '#fff';
  $('cGanhos').textContent = BRL(ganhos);
  $('cGastos').textContent = BRL(gastos);
  $('hSub').textContent = txs.length ? txs.length+' lançamento(s) no período' : 'toque no + para lançar 👇';

  // donut
  const byCat = {};
  txs.filter(t=>t.kind==='expense').forEach(t=>{ byCat[t.category]=(byCat[t.category]||0)+t.amount_cents; });
  const entries = Object.entries(byCat).sort((a,b)=>b[1]-a[1]);
  const total = entries.reduce((s,e)=>s+e[1],0);
  $('donutV').textContent = total? BRL(total).replace(',00','') : 'R$ 0';
  if(total){
    let acc=0, grad=[];
    entries.slice(0,6).forEach(([n,v])=>{
      const c=catOf(n), p=v/total*100;
      grad.push(`${c.color} ${acc}% ${acc+p}%`); acc+=p;
    });
    $('donut').style.background = `conic-gradient(${grad.join(',')})`;
    $('legend').innerHTML = entries.slice(0,6).map(([n,v])=>{
      const c=catOf(n);
      return `<div class="li"><span class="dot" style="background:${c.color}"></span>${c.icon} ${n}<span class="pct">${Math.round(v/total*100)}%</span></div>`;
    }).join('');
  } else {
    $('donut').style.background = 'rgba(0,0,0,.06)';
    $('legend').innerHTML = '<div class="li" style="color:var(--muted)">Nenhum gasto no mês ainda</div>';
  }

  // list
  const box = $('txList');
  if(!txs.length){
    box.innerHTML = `<div class="empty"><span class="big">🪴</span>Nada por aqui ainda.<br>Toque no botão + para lançar 👇</div>`;
    return;
  }
  box.innerHTML = txs.map(t=>{
    const c=catOf(t.category);
    const [y,m,d]=t.occurred_on.split('-');
    return `<div class="tx">
      <div class="ico">${c.icon}</div>
      <div class="info"><div class="desc">${esc(t.description)}</div>
        <div class="meta">${c.name} · ${d}/${m}</div></div>
      <div class="val ${t.kind==='income'?'up':'down'}">${t.kind==='income'?'+':'−'}${BRL(t.amount_cents).replace('R$','R$ ')}</div>
      <div class="acts"><button onclick="openEdit('${t.id}')">✏️</button><button onclick="delTx('${t.id}')">🗑️</button></div>
    </div>`;
  }).join('');
}
const esc = s => (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

/* ---------- input / preview ---------- */
function showPreview(p, raw){
  pending = {...p, raw_text:raw};
  const c = catOf(p.category);
  $('preview').innerHTML = `
    <div class="prow"><span style="font-size:26px">${p.kind==='income'?'📈':'📉'}</span>
      <span class="pval ${p.kind==='income'?'up':'down'}">${p.kind==='income'?'+':'−'} ${BRL(p.amount_cents)}</span>
      <span class="pchip">${c.icon} ${c.name}</span></div>
    <div class="pdesc">${esc(p.description)} · ${p.occurred_on.split('-').reverse().join('/')}</div>
    <div id="editForm">
      <div class="erow">
        <input id="pDesc" value="${esc(p.description)}" placeholder="Descrição">
        <input id="pVal" inputmode="decimal" value="${(p.amount_cents/100).toFixed(2).replace('.',',')}" style="max-width:110px" placeholder="0,00">
      </div>
      <select id="pCat">${ALL_CATS.map(x=>`<option ${x.name===p.category?'selected':''}>${x.name}</option>`).join('')}</select>
    </div>
    <div class="pbtns">
      <button class="btn btn-ok" onclick="confirmTx()">✅ Confirmar</button>
      <button class="btn btn-edit" onclick="togglePedit()">✏️ Ajustar</button>
      <button class="btn btn-cancel" onclick="hidePreview()">✕</button>
    </div>`;
  $('preview').classList.add('show');
}
function togglePedit(){ $('editForm').classList.toggle('show'); }
function hidePreview(){ $('preview').classList.remove('show'); $('preview').innerHTML=''; pending=null; hideBar(); }
function confirmTx(){
  if(!$('editForm').classList.contains('show')){
    commitTx(pending); return;
  }
  const v = $('pVal').value.replace(/\./g,'').replace(',','.');
  const cents = Math.round(parseFloat(v)*100);
  if(!cents || cents<=0){ alert('Valor inválido'); return; }
  commitTx({...pending, description:$('pDesc').value.trim()||pending.description,
            amount_cents:cents, category:$('pCat').value});
}
function commitTx(p){
  const txs = load();
  txs.push({id:uid(), kind:p.kind, amount_cents:p.amount_cents, category:p.category,
            description:p.description, occurred_on:p.occurred_on,
            raw_text:p.raw_text||'', created_at:new Date().toISOString()});
  save(txs); hidePreview(); $('txt').value='';
  anchor = new Date(p.occurred_on+'T12:00:00');
  render();
}
function handleSend(){
  const raw = $('txt').value.trim();
  if(!raw) return;
  const p = parseText(raw);
  if(!p){ alert('Não entendi o valor 🤔\nTente: "gastei 50 no mercado"'); return; }
  showPreview(p, raw);
}
$('sendBtn').onclick = handleSend;
$('txt').addEventListener('keydown', e=>{ if(e.key==='Enter') handleSend(); });

/* ---------- barra retrátil ---------- */
function showBar(){ $('inputbar').classList.remove('hidden'); $('fab').classList.add('hidden');
  setTimeout(()=>{ try{$('txt').focus();}catch(e){} },350); }
function hideBar(){ $('inputbar').classList.add('hidden'); $('fab').classList.remove('hidden');
  try{$('txt').blur();}catch(e){} }
$('fab').onclick = ()=>showBar();
$('hideBar').onclick = ()=>hideBar();
document.querySelector('.wrap').addEventListener('click', e=>{
  if(e.target.closest('button,input,select,a')) return;
  if($('inputbar').classList.contains('hidden')) showBar();
});

/* ---------- edit / delete ---------- */
function openEdit(id){
  const t = load().find(x=>x.id===id); if(!t) return;
  editingId = id;
  $('eDesc').value=t.description;
  $('eVal').value=(t.amount_cents/100).toFixed(2).replace('.',',');
  $('eCat').innerHTML = ALL_CATS.map(c=>`<option ${c.name===t.category?'selected':''}>${c.name}</option>`).join('');
  $('eDate').value=t.occurred_on;
  setKind(t.kind);
  $('editModal').classList.add('show');
}
function setKind(k){
  $('kExp').className = k==='expense'?'on-expense':'';
  $('kInc').className = k==='income'?'on-income':'';
  $('kExp').dataset.k = k; // guarda atual
}
$('kExp').onclick = ()=>setKind('expense');
$('kInc').onclick = ()=>setKind('income');
$('eClose').onclick = ()=>$('editModal').classList.remove('show');
$('editModal').addEventListener('click', e=>{ if(e.target.id==='editModal') $('editModal').classList.remove('show'); });
$('eSave').onclick = ()=>{
  const txs = load(); const t = txs.find(x=>x.id===editingId); if(!t) return;
  const v = $('eVal').value.replace(/\./g,'').replace(',','.');
  const cents = Math.round(parseFloat(v)*100);
  if(!cents || cents<=0){ alert('Valor inválido'); return; }
  t.description = $('eDesc').value.trim()||t.description;
  t.amount_cents = cents; t.category = $('eCat').value; t.occurred_on = $('eDate').value||t.occurred_on;
  t.kind = $('kExp').className.includes('on-expense') ? 'expense' : 'income';
  save(txs); $('editModal').classList.remove('show'); render();
};
function delTx(id){
  if(!confirm('Excluir este lançamento?')) return;
  save(load().filter(t=>t.id!==id)); render();
}

/* ---------- month nav ---------- */
function shiftPeriod(dir){
  const a=new Date(anchor.getFullYear(),anchor.getMonth(),anchor.getDate());
  if(period==='week'){ a.setDate(a.getDate()+7*dir); anchor=a; }
  else if(period==='half'){
    const y=a.getFullYear(), m=a.getMonth(), first=a.getDate()<=15;
    anchor = dir<0 ? (first? new Date(y,m-1,16) : new Date(y,m,1))
                  : (first? new Date(y,m,16) : new Date(y,m+1,1));
  }
  else { a.setMonth(a.getMonth()+dir); anchor=a; }
  render();
}
$('prevM').onclick = ()=>shiftPeriod(-1);
$('nextM').onclick = ()=>shiftPeriod(1);
document.querySelectorAll('#segPeriod button').forEach(b=>{
  b.onclick=()=>{
    document.querySelectorAll('#segPeriod button').forEach(x=>x.classList.remove('on'));
    b.classList.add('on'); period=b.dataset.p; anchor=new Date(); render();
  };
});

/* ---------- relatório PDF ---------- */
$('btnPdf').onclick = ()=>{
  const R = getRange();
  const txs = periodTxs().sort((a,b)=> a.occurred_on.localeCompare(b.occurred_on) || a.created_at.localeCompare(b.created_at));
  const ganhos = txs.filter(t=>t.kind==='income').reduce((s,t)=>s+t.amount_cents,0);
  const gastos = txs.filter(t=>t.kind==='expense').reduce((s,t)=>s+t.amount_cents,0);
  const byCat = {};
  txs.filter(t=>t.kind==='expense').forEach(t=>{ byCat[t.category]=(byCat[t.category]||0)+t.amount_cents; });
  const cats = Object.entries(byCat).sort((a,b)=>b[1]-a[1]);
  const hoje = new Date().toLocaleDateString('pt-BR');
  const fdate = iso => iso.split('-').reverse().join('/');
  $('printReport').innerHTML = `
    <h1>💰 Minhas Finanças</h1>
    <h2>Relatório · ${R.label}</h2>
    <p class="pr-date">Gerado em ${hoje}</p>
    <div class="pr-kpis">
      <div class="pr-kpi"><div class="l">GANHOS</div><div class="v" style="color:#16a34a">${BRL(ganhos)}</div></div>
      <div class="pr-kpi"><div class="l">GASTOS</div><div class="v" style="color:#dc2626">${BRL(gastos)}</div></div>
      <div class="pr-kpi"><div class="l">SALDO</div><div class="v">${BRL(ganhos-gastos)}</div></div>
    </div>
    <h3>Gastos por categoria</h3>
    <table><tr><th>Categoria</th><th class="num">Valor</th><th class="num">%</th></tr>
    ${cats.length ? cats.map(([n,v])=>`<tr><td>${catOf(n).icon} ${n}</td><td class="num">${BRL(v)}</td><td class="num">${Math.round(v/gastos*100)}%</td></tr>`).join('') : '<tr><td colspan="3">Sem gastos no período</td></tr>'}
    </table>
    <h3>Lançamentos (${txs.length})</h3>
    <table><tr><th>Data</th><th>Descrição</th><th>Categoria</th><th class="num">Valor</th></tr>
    ${txs.length ? txs.map(t=>`<tr><td>${fdate(t.occurred_on)}</td><td>${esc(t.description)}</td><td>${t.category}</td><td class="num">${t.kind==='income'?'+':'−'} ${BRL(t.amount_cents)}</td></tr>`).join('') : '<tr><td colspan="4">Nenhum lançamento no período</td></tr>'}
    </table>`;
  setTimeout(()=>window.print(), 80);
};

render();
</script>
<div id="printReport"></div>
</body>
</html>
